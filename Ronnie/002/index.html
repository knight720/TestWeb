<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALL RUNNER 爬牆跑酷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1f1c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    font-family: monospace;
  }
  canvas { display: block; }
  #hint {
    color: rgba(180, 220, 210, 0.35);
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">← → / A D 移動 &nbsp;|&nbsp; SPACE / ↑ / W 跳躍 &nbsp;|&nbsp; 貼牆按跳躍可跳牆</div>
<script>
'use strict';

// ── Canvas ─────────────────────────────────────────────────────────────────────
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const W = cv.width  = 900;
const H = cv.height = 500;

// ── 物理常數 ───────────────────────────────────────────────────────────────────
const GRAV        = 0.58;
const MAX_FALL    = 14;
const JUMP_VEL    = -14;
const WALL_SLIDE  = 2.2;   // 爬牆時最大下滑速度
const WALL_JX     = 8.5;
const WALL_JY     = -13;
const MOVE_SPD    = 5.2;
const TILE        = 60;

// ── 關卡資料 ───────────────────────────────────────────────────────────────────
const LW = 4500, LH = 1800;

// 平台: { x, y, w, h }
const platforms = [
  // 地板
  { x: -100, y: 1380, w: 4700, h: 420 },
  // 左牆
  { x: -80,  y: 0,    w: 80,   h: 1800 },
  // 右牆
  { x: LW,   y: 0,    w: 80,   h: 1800 },

  // ─── 區域 1 ───
  { x: 0,    y: 1000, w: 640,  h: 380 },   // 左下大平台
  { x: 460,  y: 860,  w: 320,  h: 50  },
  { x: 120,  y: 680,  w: 280,  h: 50  },
  { x: 500,  y: 560,  w: 360,  h: 50  },
  { x: 820,  y: 760,  w: 420,  h: 50  },
  // 可爬牆壁
  { x: 450,  y: 300,  w: 55,   h: 560 },
  { x: 870,  y: 150,  w: 55,   h: 620 },

  // ─── 區域 2 ───
  { x: 1000, y: 1100, w: 300,  h: 280 },
  { x: 1380, y: 950,  w: 260,  h: 50  },
  { x: 1700, y: 800,  w: 300,  h: 50  },
  { x: 1480, y: 650,  w: 250,  h: 50  },
  { x: 1200, y: 500,  w: 220,  h: 50  },
  { x: 950,  y: 350,  w: 250,  h: 50  },
  { x: 1180, y: 100,  w: 55,   h: 430 },
  { x: 1550, y: 200,  w: 55,   h: 400 },

  // ─── 區域 3 ───
  { x: 2000, y: 1150, w: 280,  h: 230 },
  { x: 2350, y: 1000, w: 250,  h: 50  },
  { x: 2650, y: 850,  w: 300,  h: 50  },
  { x: 2400, y: 700,  w: 250,  h: 50  },
  { x: 2150, y: 550,  w: 240,  h: 50  },
  { x: 2500, y: 400,  w: 280,  h: 50  },
  { x: 2800, y: 600,  w: 55,   h: 380 },

  // ─── 區域 4 (終點) ───
  { x: 3000, y: 1100, w: 260,  h: 280 },
  { x: 3320, y: 950,  w: 260,  h: 50  },
  { x: 3620, y: 800,  w: 300,  h: 50  },
  { x: 3900, y: 650,  w: 250,  h: 50  },
  { x: 3600, y: 500,  w: 200,  h: 50  },
  { x: 3300, y: 380,  w: 220,  h: 50  },
  { x: 3080, y: 250,  w: 55,   h: 330 },
  { x: 3480, y: 150,  w: 55,   h: 380 },
  { x: 3900, y: 200,  w: 300,  h: 50  },  // 終點平台
];

// 尖刺: { x, y, w, h, dir }  dir: 'up'|'down'|'right'|'left'
const spikes = [
  // 地板空隙尖刺
  { x: 650,  y: 1380, w: 360, h: 20, dir: 'up'   },
  { x: 1300, y: 1380, w: 240, h: 20, dir: 'up'   },
  { x: 1680, y: 1380, w: 300, h: 20, dir: 'up'   },
  { x: 2280, y: 1380, w: 300, h: 20, dir: 'up'   },
  { x: 2950, y: 1380, w: 220, h: 20, dir: 'up'   },
  { x: 3280, y: 1380, w: 340, h: 20, dir: 'up'   },
  { x: 3620, y: 1380, w: 260, h: 20, dir: 'up'   },
  // 浮空尖刺床
  { x: 850,  y: 1000, w: 360, h: 20, dir: 'up'   },
  { x: 1640, y: 1050, w: 340, h: 20, dir: 'up'   },
  { x: 2300, y: 1050, w: 320, h: 20, dir: 'up'   },
  // 左牆尖刺
  { x: -80,  y: 600,  w: 20,  h: 300, dir: 'right' },
  { x: -80,  y: 350,  w: 20,  h: 180, dir: 'right' },
];

// X 標記裝飾 (危險區域視覺提示，不造成傷害)
const xMarkers = [
  { x: 0,   y: 100, rows: 7, cols: 2 },
  { x: 0,   y: 680, rows: 5, cols: 2 },
];

// ── 終點位置 ───────────────────────────────────────────────────────────────────
const GOAL_X = 4020, GOAL_Y = 140;
const SPAWN_X = 100, SPAWN_Y = 900;

// ── 玩家狀態 ───────────────────────────────────────────────────────────────────
let pl = {
  x: SPAWN_X, y: SPAWN_Y,
  vx: 0, vy: 0,
  w: 24, h: 44,
  onGround: false,
  onWall: 0,        // -1=左牆, 0=無, 1=右牆
  wallCooldown: 0,
  jumpsLeft: 2,
  facing: 1,
  animTick: 0,
  alive: true,
  deathTimer: 0,
};

// ── 鏡頭 ──────────────────────────────────────────────────────────────────────
let cam = { x: 0, y: 0 };

// ── 輸入 ──────────────────────────────────────────────────────────────────────
const K = {};
let jumpQueued = false;
window.addEventListener('keydown', e => {
  if (!K[e.code]) {
    K[e.code] = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jumpQueued = true;
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { K[e.code] = false; });

// ── 遊戲模式 ──────────────────────────────────────────────────────────────────
let gameMode = 'play'; // play | dead | win

// ── 粒子特效 ──────────────────────────────────────────────────────────────────
let particles = [];

function spawnDeathFX(x, y) {
  for (let i = 0; i < 22; i++) {
    const a = (Math.PI * 2 * i) / 22 + Math.random() * 0.3;
    const s = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 2,
      life: 35 + Math.random() * 30,
      maxLife: 65,
      color: Math.random() < 0.5 ? '#ff8c00' : '#ff3333',
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.28;
    if (--p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    cx.globalAlpha = p.life / p.maxLife;
    cx.fillStyle = p.color;
    cx.fillRect(p.x - cam.x - 3, p.y - cam.y - 3, 6, 6);
  }
  cx.globalAlpha = 1;
}

// ── 工具函數 ───────────────────────────────────────────────────────────────────
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function hitSpike() {
  const ts = 18;
  for (const s of spikes) {
    if (s.dir === 'up') {
      if (aabb(pl.x + 2, pl.y, pl.w - 4, pl.h, s.x, s.y - ts, s.w, ts)) return true;
    } else if (s.dir === 'down') {
      if (aabb(pl.x + 2, pl.y, pl.w - 4, pl.h, s.x, s.y, s.w, ts)) return true;
    } else if (s.dir === 'right') {
      if (aabb(pl.x, pl.y + 2, pl.w, pl.h - 4, s.x + 4, s.y, ts, s.h)) return true;
    } else if (s.dir === 'left') {
      if (aabb(pl.x, pl.y + 2, pl.w, pl.h - 4, s.x + s.w - 4 - ts, s.y, ts, s.h)) return true;
    }
  }
  return false;
}

function die() {
  if (!pl.alive) return;
  pl.alive = false;
  gameMode = 'dead';
  pl.deathTimer = 0;
  spawnDeathFX(pl.x + pl.w / 2, pl.y + pl.h / 2);
}

function respawn() {
  pl.x = SPAWN_X; pl.y = SPAWN_Y;
  pl.vx = 0; pl.vy = 0;
  pl.alive = true;
  pl.onGround = false;
  pl.onWall = 0;
  pl.wallCooldown = 0;
  pl.jumpsLeft = 2;
  gameMode = 'play';
  particles = [];
}

// ── 更新邏輯 ───────────────────────────────────────────────────────────────────
function update() {
  updateParticles();

  if (gameMode === 'dead') {
    pl.deathTimer++;
    if (pl.deathTimer > 90) respawn();
    jumpQueued = false;
    return;
  }

  if (gameMode === 'win') {
    // 在終點可以繼續移動欣賞
    jumpQueued = false;
    return;
  }

  const left  = K['ArrowLeft']  || K['KeyA'];
  const right = K['ArrowRight'] || K['KeyD'];

  // 水平移動
  if (left)       { pl.vx = -MOVE_SPD; pl.facing = -1; }
  else if (right) { pl.vx =  MOVE_SPD; pl.facing =  1; }
  else            { pl.vx *= 0.72; }

  // 重力
  pl.vy = Math.min(pl.vy + GRAV, MAX_FALL);

  // 爬牆下滑減速
  if (pl.onWall !== 0 && !pl.onGround) {
    const pushing = (pl.onWall === 1 && right) || (pl.onWall === -1 && left);
    if (pushing && pl.vy > WALL_SLIDE) pl.vy = WALL_SLIDE;
  }

  // 跳躍
  if (jumpQueued) {
    jumpQueued = false;
    if (pl.onWall !== 0 && !pl.onGround) {
      // 牆壁跳
      pl.vy = WALL_JY;
      pl.vx = -pl.onWall * WALL_JX;
      pl.wallCooldown = 14;
    } else if (pl.jumpsLeft > 0) {
      pl.vy = JUMP_VEL;
      pl.jumpsLeft--;
    }
  }

  if (pl.wallCooldown > 0) pl.wallCooldown--;

  // ── 移動 X + 碰撞 ──
  pl.x += pl.vx;
  pl.onWall = 0;
  for (const p of platforms) {
    if (aabb(pl.x, pl.y + 3, pl.w, pl.h - 6, p.x, p.y, p.w, p.h)) {
      if (pl.vx > 0) { pl.x = p.x - pl.w; if (pl.wallCooldown <= 0) pl.onWall =  1; }
      else if (pl.vx < 0) { pl.x = p.x + p.w; if (pl.wallCooldown <= 0) pl.onWall = -1; }
      pl.vx = 0;
    }
  }

  // ── 移動 Y + 碰撞 ──
  pl.y += pl.vy;
  pl.onGround = false;
  for (const p of platforms) {
    if (aabb(pl.x + 3, pl.y, pl.w - 6, pl.h, p.x, p.y, p.w, p.h)) {
      if (pl.vy >= 0) {
        pl.y = p.y - pl.h;
        pl.onGround = true;
        pl.jumpsLeft = 2;
        pl.onWall = 0;
      } else {
        pl.y = p.y + p.h;
      }
      pl.vy = 0;
    }
  }

  if (pl.onGround) pl.wallCooldown = 0;

  // 死亡判定
  if (hitSpike() || pl.y > LH + 100) die();

  // 終點判定
  if (pl.x + pl.w > GOAL_X && pl.x < GOAL_X + 60 &&
      pl.y + pl.h > GOAL_Y  && pl.y < GOAL_Y + 100) {
    gameMode = 'win';
  }

  pl.animTick++;

  // 鏡頭跟隨
  const tx = pl.x - W * 0.35;
  const ty = pl.y - H * 0.45;
  cam.x += (tx - cam.x) * 0.12;
  cam.y += (ty - cam.y) * 0.12;
  cam.x = Math.max(0, Math.min(LW - W, cam.x));
  cam.y = Math.max(0, Math.min(LH - H, cam.y));
}

// ── 繪圖函數 ───────────────────────────────────────────────────────────────────
function drawBg() {
  cx.fillStyle = '#1d5f57';
  cx.fillRect(0, 0, W, H);
  // 背景格線
  cx.strokeStyle = 'rgba(255,255,255,0.062)';
  cx.lineWidth = 1;
  const gs = TILE;
  const ox = ((-cam.x % gs) + gs) % gs;
  const oy = ((-cam.y % gs) + gs) % gs;
  for (let x = ox - gs; x <= W + gs; x += gs) {
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke();
  }
  for (let y = oy - gs; y <= H + gs; y += gs) {
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
}

function drawPlatform(p) {
  const sx = p.x - cam.x, sy = p.y - cam.y;
  if (sx + p.w < -10 || sx > W + 10 || sy + p.h < -10 || sy > H + 10) return;
  // 主體
  cx.fillStyle = '#ddd5c0';
  cx.fillRect(sx, sy, p.w, p.h);
  // 平台內格線
  cx.strokeStyle = 'rgba(190,180,158,0.45)';
  cx.lineWidth = 1;
  const gs = TILE;
  const startGX = Math.ceil(p.x / gs) * gs;
  for (let gx = startGX; gx < p.x + p.w; gx += gs) {
    const lx = gx - cam.x;
    cx.beginPath(); cx.moveTo(lx, sy); cx.lineTo(lx, sy + p.h); cx.stroke();
  }
  const startGY = Math.ceil(p.y / gs) * gs;
  for (let gy = startGY; gy < p.y + p.h; gy += gs) {
    const ly = gy - cam.y;
    cx.beginPath(); cx.moveTo(sx, ly); cx.lineTo(sx + p.w, ly); cx.stroke();
  }
  // 立體陰影邊緣
  cx.fillStyle = 'rgba(0,0,0,0.10)';
  cx.fillRect(sx + 5, sy + p.h - 6, p.w - 5, 6);
  cx.fillRect(sx + p.w - 6, sy + 5, 6, p.h - 5);
}

function drawSpikes(s) {
  const ts = 18;
  cx.fillStyle = '#b31e24';

  if (s.dir === 'up' || s.dir === 'down') {
    const count = Math.floor(s.w / ts);
    const sx0 = s.x - cam.x, sy0 = s.y - cam.y;
    // 底座
    cx.fillStyle = '#8a1218';
    cx.fillRect(sx0, sy0 - (s.dir === 'up' ? 4 : 0), s.w, 4);
    cx.fillStyle = '#c0222a';
    for (let i = 0; i < count; i++) {
      const tx = sx0 + i * ts;
      cx.beginPath();
      if (s.dir === 'up') {
        cx.moveTo(tx, sy0); cx.lineTo(tx + ts / 2, sy0 - ts); cx.lineTo(tx + ts, sy0);
      } else {
        cx.moveTo(tx, sy0); cx.lineTo(tx + ts / 2, sy0 + ts); cx.lineTo(tx + ts, sy0);
      }
      cx.closePath(); cx.fill();
    }
  } else if (s.dir === 'right') {
    const count = Math.floor(s.h / ts);
    const sx0 = s.x - cam.x, sy0 = s.y - cam.y;
    cx.fillStyle = '#8a1218';
    cx.fillRect(sx0 + 4, sy0, 4, s.h);
    cx.fillStyle = '#c0222a';
    for (let i = 0; i < count; i++) {
      const ty = sy0 + i * ts;
      cx.beginPath();
      cx.moveTo(sx0 + 8, ty); cx.lineTo(sx0 + 8 + ts, ty + ts / 2); cx.lineTo(sx0 + 8, ty + ts);
      cx.closePath(); cx.fill();
    }
  }
}

function drawXMarkers() {
  cx.strokeStyle = 'rgba(80, 148, 68, 0.70)';
  cx.lineWidth = 2.5;
  cx.lineCap = 'round';
  const ts = TILE;
  for (const m of xMarkers) {
    for (let row = 0; row < m.rows; row++) {
      for (let col = 0; col < m.cols; col++) {
        const wx = m.x + col * ts + 12;
        const wy = m.y + row * ts + 12;
        const sx = wx - cam.x, sy = wy - cam.y;
        const sz = ts - 24;
        cx.beginPath();
        cx.moveTo(sx, sy); cx.lineTo(sx + sz, sy + sz);
        cx.moveTo(sx + sz, sy); cx.lineTo(sx, sy + sz);
        cx.stroke();
      }
    }
  }
}

function drawGoal() {
  const sx = GOAL_X - cam.x;
  const sy = GOAL_Y - cam.y;
  const t  = Date.now() * 0.004;
  // 光暈
  const gr = cx.createRadialGradient(sx + 30, sy + 50, 5, sx + 30, sy + 50, 65);
  gr.addColorStop(0, 'rgba(255,220,50,0.35)');
  gr.addColorStop(1, 'rgba(255,220,50,0)');
  cx.fillStyle = gr;
  cx.fillRect(sx - 35, sy - 15, 130, 130);
  // 旋轉鑽石
  cx.save();
  cx.translate(sx + 30, sy + 30);
  cx.rotate(t * 0.9);
  cx.fillStyle = '#ffe033';
  cx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    cx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20);
    cx.lineTo(Math.cos(a + Math.PI / 4) * 9, Math.sin(a + Math.PI / 4) * 9);
  }
  cx.closePath(); cx.fill();
  cx.restore();
}

// 繪製火柴人
function drawPlayer() {
  if (!pl.alive) return;
  const sx = pl.x + pl.w / 2 - cam.x;
  const sy = pl.y - cam.y;
  cx.save();
  cx.translate(sx, sy);
  if (pl.facing === -1) cx.scale(-1, 1);

  const moving    = Math.abs(pl.vx) > 0.5 && pl.onGround;
  const legSwing  = moving ? Math.sin(pl.animTick * 0.22) * 10 : 0;
  const armSwing  = moving ? Math.sin(pl.animTick * 0.22 + Math.PI) * 7 : 0;
  const wallSlide = pl.onWall !== 0 && !pl.onGround;

  // 頭部 (橘色)
  cx.fillStyle = '#ff8c00';
  cx.beginPath(); cx.arc(0, 9, 9, 0, Math.PI * 2); cx.fill();
  // 頭部高光
  cx.fillStyle = 'rgba(255,215,110,0.45)';
  cx.beginPath(); cx.arc(-2, 5, 4, 0, Math.PI * 2); cx.fill();

  // 身體骨架
  cx.strokeStyle = '#111';
  cx.lineWidth = 2.8;
  cx.lineCap = 'round';
  cx.lineJoin = 'round';

  // 軀幹
  cx.beginPath(); cx.moveTo(0, 18); cx.lineTo(0, 33); cx.stroke();

  // 手臂
  if (wallSlide) {
    // 爬牆動作：手伸向牆
    cx.beginPath(); cx.moveTo(0, 22); cx.lineTo(14, 17); cx.stroke();
    cx.beginPath(); cx.moveTo(0, 22); cx.lineTo(-7, 28); cx.stroke();
  } else {
    cx.beginPath(); cx.moveTo(0, 22); cx.lineTo( 12 + armSwing, 30); cx.stroke();
    cx.beginPath(); cx.moveTo(0, 22); cx.lineTo(-12 - armSwing, 30); cx.stroke();
  }

  // 腿
  if (wallSlide) {
    cx.beginPath(); cx.moveTo(0, 33); cx.lineTo(7,  44); cx.stroke();
    cx.beginPath(); cx.moveTo(0, 33); cx.lineTo(-3, 44); cx.stroke();
  } else {
    cx.beginPath(); cx.moveTo(0, 33); cx.lineTo(-9 + legSwing,  44); cx.stroke();
    cx.beginPath(); cx.moveTo(0, 33); cx.lineTo( 9 - legSwing,  44); cx.stroke();
  }

  cx.restore();
}

function drawHUD() {
  // 頂部 HUD 框
  cx.fillStyle = 'rgba(0,0,0,0.30)';
  cx.fillRect(W / 2 - 90, 8, 180, 42);
  cx.strokeStyle = 'rgba(255,255,255,0.12)';
  cx.lineWidth = 1;
  cx.strokeRect(W / 2 - 90, 8, 180, 42);

  cx.fillStyle = 'rgba(255,255,255,0.65)';
  cx.font = 'bold 11px monospace';
  cx.textAlign = 'center';
  cx.fillText('WORLD 1', W / 2, 26);

  // 進度鑽石圖示 (仿截圖)
  const progress = Math.min(pl.x / (GOAL_X + 60), 1);
  for (let i = 0; i < 5; i++) {
    const dx = W / 2 - 36 + i * 18;
    const dy = 40;
    const filled = i <= Math.floor(progress * 5);
    cx.fillStyle = filled ? '#ffffff' : 'rgba(255,255,255,0.25)';
    cx.save();
    cx.translate(dx, dy);
    cx.rotate(Math.PI / 4);
    cx.fillRect(-3, -3, 6, 6);
    cx.restore();
  }

  // 爬牆提示 (貼牆時顯示)
  if (pl.onWall !== 0 && !pl.onGround) {
    cx.fillStyle = 'rgba(255,220,80,0.85)';
    cx.font = '13px monospace';
    cx.textAlign = 'center';
    cx.fillText('↑ 牆跳', W / 2, H - 20);
  }
}

function drawOverlay() {
  if (gameMode === 'dead') {
    cx.fillStyle = 'rgba(0,0,0,0.45)';
    cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#ff4444';
    cx.font = 'bold 46px monospace';
    cx.textAlign = 'center';
    cx.fillText('YOU DIED', W / 2, H / 2 - 20);
    cx.fillStyle = 'rgba(255,255,255,0.5)';
    cx.font = '16px monospace';
    cx.fillText('重新開始中...', W / 2, H / 2 + 22);
  }
  if (gameMode === 'win') {
    cx.fillStyle = 'rgba(0,0,0,0.52)';
    cx.fillRect(0, 0, W, H);
    const t = Date.now() * 0.003;
    cx.fillStyle = `hsl(${(t * 30) % 360}, 90%, 65%)`;
    cx.font = 'bold 52px monospace';
    cx.textAlign = 'center';
    cx.fillText('關卡完成！', W / 2, H / 2 - 20);
    cx.fillStyle = 'rgba(255,255,255,0.6)';
    cx.font = '18px monospace';
    cx.fillText('恭喜過關 🎉', W / 2, H / 2 + 30);
  }
}

// ── 主迴圈 ────────────────────────────────────────────────────────────────────
function loop() {
  update();
  drawBg();
  drawXMarkers();
  for (const p of platforms) drawPlatform(p);
  for (const s of spikes)    drawSpikes(s);
  drawGoal();
  drawPlayer();
  drawParticles();
  drawHUD();
  drawOverlay();
  requestAnimationFrame(loop);
}
loop();
</script>
